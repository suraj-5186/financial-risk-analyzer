services:
  - type: web
    name: finrisk-ai-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finrisk-ai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "https://frontend-cyan-mu-38.vercel.app,https://frontend-5khflfdss-surajearlybird-8597s-projects.vercel.app"
      - key: FRONTEND_URL
        value: "https://frontend-cyan-mu-38.vercel.app"
      - key: GEMINI_API_KEY
        value: ""
      - key: PYTHON_VERSION
        value: "3.11"

databases:
  - name: finrisk-ai-db
    databaseName: finrisk_ai
    user: finrisk_ai
    plan: free
