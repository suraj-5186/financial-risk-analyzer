version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./financial_risk.db
      - SECRET_KEY=supersecretkeyforfinancialriskanalyzer1234567890!
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    volumes:
      - backend-db:/app/backend
      - uploads-data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-db:
  uploads-data:
