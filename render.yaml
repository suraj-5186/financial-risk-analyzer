services:
  - type: web
    name: finrisk-ai-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finrisk-ai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
        # REQUIRED: Set this to your Vercel frontend URL before deploying.
        # Example: https://your-app.vercel.app (or comma-separated URLs including custom domain)
        # In production, if unset or empty, all cross-origin requests are blocked for security.
        # Set via Render dashboard: Environment → ALLOWED_ORIGINS → <your Vercel URL>
      - key: GEMINI_API_KEY
        value: ""
      - key: PYTHON_VERSION
        value: "3.11"

databases:
  - name: finrisk-ai-db
    databaseName: finrisk_ai
    user: finrisk_ai
    plan: free
